name: CI/CD Pipeline
on:
  push:
    branches: [ "main", "feature/cicd" ] # Déclencheur
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    # 1. Récupérer le code
      - name: Checkout Code
        uses: actions/checkout@v3
    # 2. Se connecter à Docker Hub (Via les Secrets)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
# 3. Construire l'image et Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
# Tag dynamique avec votre username secret
          tags: ${{ secrets.DOCKER_USERNAME }}/course-survey-app:latest
